[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "django-rest-mcp"
dynamic = ["version"]
description = "MCP server for Django REST Framework — auto-discovers DRF views and exposes them as MCP tools"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.14",
    "mcp>=1.26",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/drf_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/drf_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
